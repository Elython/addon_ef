<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DemonicScans Energy Farmer - Debug Console</title>
    <style>
        :root {
            --bg-color: #11111b;
            --surface-color: #1e1e2e;
            --border-color: #45475a;
            --text-color: #cdd6f4;
            --subtext-color: #a6adc8;
            --accent-color: #89b4fa;
            --success-color: #a6e3a1;
            --warning-color: #f9e2af;
            --error-color: #f38ba8;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .icon {
            display: inline-block;
            vertical-align: middle;
            width: 14px;
            height: 14px;
            stroke-width: 2px;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        h2 { 
            margin: 0; 
            color: var(--accent-color); 
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            color: var(--warning-color);
        }

        .controls { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px; 
            flex-wrap: wrap;
        }

        button { 
            background: var(--accent-color); 
            color: #11111b; 
            padding: 8px 14px; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        button:hover { filter: brightness(1.1); }
        
        #clearBtn { background: var(--error-color); }
        #refreshBtn { background: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); }

        #logs { 
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap; 
            word-wrap: break-word; 
            background: var(--surface-color);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 12px;
            line-height: 1.4;
        }

        .log-line { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 2px; }
        .log-error { color: var(--error-color); }
        .log-warn { color: var(--warning-color); }
        .log-info { color: var(--success-color); }
        .log-debug { color: var(--subtext-color); }
    </style>
</head>
<body>
    <div class="header">
        <h2>
            <svg class="icon" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
            Energy Farmer Debug Console
        </h2>
        <div id="statusBadge" class="status-badge">Checking Debug Mode...</div>
    </div>

    <div class="controls">
        <button id="downloadBtn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            Download Log (.txt)
        </button>
        <button id="refreshBtn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            Refresh Logs
        </button>
        <button id="clearBtn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
            Clear Console
        </button>
        <label style="display:flex; align-items:center; gap:5px; font-size:12px; margin-left:auto; cursor:pointer;">
            <input type="checkbox" id="chkAutoScroll" checked> Auto-Scroll
        </label>
    </div>

    <div id="logs"><div class="log-debug">Loading debug logs from extension storage...</div></div>

    <script src="console.js"></script>
</body>
</html>
